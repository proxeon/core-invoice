name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: cbindgen header
        run: |
          if command -v cbindgen >/dev/null; then
            cbindgen --config cbindgen.toml --crate core-invoice-sys --output /tmp/core_invoice.h
            diff -u crates/core-invoice-sys/include/core_invoice.h /tmp/core_invoice.h
          else
            echo "cbindgen not installed; skip drift check"
          fi

  artefacts:
    runs-on: ubuntu-latest
    # PR skip is OK. A v* tag / release must fetch refers/. `[artefacts]` stays for ad-hoc runs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[artefacts]')
    env:
      CORE_INVOICE_REQUIRE_SPEC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: fetch refers
        run: bash refers/fetch.sh
      - name: official samples
        run: cargo test --workspace -- official_
      - name: svrl oracle
        env:
          SVRL_ORACLE: "1"
        run: |
          python3 xtask/svrl_oracle.py --self-test
          python3 xtask/svrl_oracle.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: wasm model
        run: cargo build -p core-invoice --target wasm32-unknown-unknown
