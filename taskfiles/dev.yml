version: "3"

tasks:
  test:
    desc: cargo test --workspace
    cmds:
      - cargo test --workspace

  build:
    desc: cargo build --workspace
    cmds:
      - cargo build --workspace

  fmt:
    desc: cargo fmt --all
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: cargo fmt --all -- --check
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: cargo clippy --workspace --all-targets
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  check:
    desc: fmt check + clippy + test
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test

  cli:
    desc: cargo run -p core-invoice-cli
    cmds:
      - cargo run -p core-invoice-cli -- {{.CLI_ARGS}}

  doc:
    desc: cargo doc --workspace --no-deps
    cmds:
      - cargo doc --workspace --no-deps --open

  "doc:check":
    desc: cargo doc without opening a browser
    cmds:
      - cargo doc --workspace --no-deps

  spec:
    desc: Fetch official artefacts into refers/ (clones/zips gitignored)
    cmds:
      - bash refers/fetch.sh

  lists:
    desc: Regenerate code-list arrays from refers/ genericode
    cmds:
      - python3 xtask/gen_codes.py

  deny:
    desc: cargo deny check (licences, advisories)
    cmds:
      - cargo deny check

  svrl:
    desc: Optional ConnectingEurope XSLT SVRL oracle (needs Saxon + refers/)
    cmds:
      - python3 xtask/svrl_oracle.py --self-test
      - python3 xtask/svrl_oracle.py

  tracked:
    desc: Fail if product crates contain TODO/FIXME/unimplemented!
    cmds:
      - |
        if grep -RInE 'TODO|FIXME|unimplemented!' crates --include='*.rs'; then
          echo "product source still has TODO/FIXME/unimplemented!" >&2
          exit 1
        fi

  fuzz:
    desc: Local cargo-fuzz target on formats::read (not default CI)
    cmds:
      - echo "cargo +nightly fuzz run formats_read  (see fuzz/)"
