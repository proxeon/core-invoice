version: "3"

tasks:
  test:
    desc: cargo test --workspace
    cmds:
      - cargo test --workspace

  build:
    desc: cargo build --workspace
    cmds:
      - cargo build --workspace

  fmt:
    desc: cargo fmt --all
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: cargo fmt --all -- --check
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: cargo clippy --workspace --all-targets
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  check:
    desc: fmt check + clippy + test
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test

  cli:
    desc: cargo run -p core-invoice-cli
    cmds:
      - cargo run -p core-invoice-cli -- {{.CLI_ARGS}}

  doc:
    desc: cargo doc --workspace --no-deps
    cmds:
      - cargo doc --workspace --no-deps --open

  "doc:check":
    desc: cargo doc without opening a browser
    cmds:
      - cargo doc --workspace --no-deps

  spec:
    desc: Fetch EN 16931 / Peppol artefacts into spec/ (gitignored, EUPL)
    cmds:
      - |
        set -euo pipefail
        mkdir -p spec
        if [ "${CORE_INVOICE_REQUIRE_SPEC:-0}" != "1" ]; then
          echo "skipping spec fetch (set CORE_INVOICE_REQUIRE_SPEC=1 to clone pins)"
          echo "pins: EN ${ARTEFACT:-validation-1.3.16}  Peppol v3.0.20  PINT-MY 1.3.0"
          exit 0
        fi
        if [ ! -d spec/eInvoicing-EN16931 ]; then
          git clone --depth 1 --branch validation-1.3.16 \
            https://github.com/ConnectingEurope/eInvoicing-EN16931.git \
            spec/eInvoicing-EN16931
          git -C spec/eInvoicing-EN16931 fetch --depth 1 origin refs/tags/validation-1.3.16
          git -C spec/eInvoicing-EN16931 checkout FETCH_HEAD
        fi
        if [ ! -d spec/peppol-bis-invoice-3 ]; then
          git clone --depth 1 --branch v3.0.20 \
            https://github.com/OpenPEPPOL/peppol-bis-invoice-3.git \
            spec/peppol-bis-invoice-3
        fi
        echo "spec artefacts present (not for git add)"
