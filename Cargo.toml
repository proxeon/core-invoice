[workspace]
resolver = "3"
members = [
    "crates/core-invoice",
    "crates/core-invoice-formats",
    "crates/core-invoice-cli",
    "crates/core-invoice-fixtures",
    "crates/core-invoice-sys",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Proxeon"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/proxeon/core-invoice"
homepage = "https://github.com/proxeon/core-invoice"
readme = "README.md"
keywords = ["einvoice", "en16931", "peppol", "pint", "ubl"]
categories = ["encoding", "parser-implementations"]

[workspace.dependencies]
core-invoice = { version = "1.0.0", path = "crates/core-invoice" }
core-invoice-formats = { version = "1.0.0", path = "crates/core-invoice-formats" }
core-invoice-fixtures = { version = "1.0.0", path = "crates/core-invoice-fixtures" }
rust_decimal = { version = "1.39", default-features = false, features = ["std"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
